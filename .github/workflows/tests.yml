name: Tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            symfony: '5.4.*'
            config: '5.4.*'
          - php: '8.1'
            symfony: '6.4.*'
            config: '6.4.*'
          - php: '8.2'
            symfony: '7.4.*'
            config: '7.4.*'
          - php: '8.4'
            symfony: '8.0.*'
            config: '7.4.*'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer update --no-interaction --prefer-dist --with "symfony/dependency-injection:${{ matrix.symfony }}" --with "symfony/config:${{ matrix.config }}"
      - run: vendor/bin/phpunit
